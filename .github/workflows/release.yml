name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LOBOT Lab ${{ github.ref_name }}
          releaseBody: Download the appropriate unsigned build for your platform from the assets below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package portable Windows ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $packageDir = Join-Path $env:RUNNER_TEMP "LOBOT Lab"
          $archive = Join-Path $PWD "LOBOT.Lab_${version}_windows-x64-portable.zip"

          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "src-tauri/target/release/lobot-lab.exe" (Join-Path $packageDir "LOBOT Lab.exe")
          Copy-Item "LICENSE" (Join-Path $packageDir "LICENSE.txt")

          @"
          LOBOT Lab $version - portable Windows x64

          Run "LOBOT Lab.exe" directly; no installation is required.

          LOBOT Lab does not include Jagged Alliance 2 game data. Use Data roots
          to select a legally obtained JA2 v1.13 installation and any mod
          overlays.

          This build is unsigned, so Windows may display a security warning.
          The Microsoft Edge WebView2 Runtime is required and is normally
          already present on supported Windows systems.

          Project: https://github.com/tais/lobot-lab
          "@ | Set-Content (Join-Path $packageDir "README.txt")

          Compress-Archive -Path $packageDir -DestinationPath $archive -CompressionLevel Optimal
          "PORTABLE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable Windows ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$env:PORTABLE_ARCHIVE" --clobber
